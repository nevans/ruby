---
#
# n.b. probably both scheduler impl and benchmark scripts are buggy.
#
# but it segfaults!  so...
#
prelude: |
  # just for fun...
  module Sugar
    refine Fiber.singleton_class do
      # A synchronous version of Fiber.schedule
      def sync
        Fiber.blocking? ? Fiber.new(blocking: false){yield}.resume : yield
      end
    end
  end
  using Sugar

  # a very simple FiberScheduler
  class Scheduler

    # an incredibly naive IO selector
    class ThreadDelegageSelector
      MAX_TIMEOUT = nil
      def initialize(scheduler)
        @scheduler = scheduler
        @wakeup_reader, @wakeup_writer = IO.pipe
      end
      def wakeup = @wakeup_writer.write_nonblock ".", exception: false
      def wait(io, events, timeout=nil) = @scheduler.t{io.wait(events, timeout)}
      def select(timeout=nil)
        timeout = timeout&.positive? ? timeout : MAX_TIMEOUT
        IO.select([@wakeup_reader], nil, nil, timeout)
        @wakeup_reader.read_nonblock(1024)
        [[], [], []]
      end
    end

    def initialize(selector: ThreadDelegageSelector)
      @lock    = Thread::Mutex.new # used for unblock
      @ready   = []
      @blocked = Hash.new { _1[_2] = [] }
      @fiber   = Fiber.new(blocking: true){run_loop}
      @selector = selector.new(self)
    end

    # Used when blocking on synchronization (Thread::Mutex#lock,
    # Thread::Queue#pop, Thread::SizedQueue#push, ...)
    def block(blocker, timeout=nil)
      fiber = Fiber.current
      after(timeout){unblock(blocker, fiber)} if timeout
      @blocked[fiber] << blocker
      @fiber.transfer # suspends this fiber until control is returned
    ensure
      @blocked.delete fiber
    end

    def unblock(_, fiber)
      @lock.synchronize {
        @blocked.delete(fiber)
        # TODO: cancel other waiters for this fiber
        @ready << fiber
      }
      @selector.wakeup
    end

    def kernel_sleep(seconds = nil)
      start = Process.clock_gettime(Process::CLOCK_MONOTONIC)
      block(:sleep, seconds)
      Process.clock_gettime(Process::CLOCK_MONOTONIC) - start
    end

    def fiber(&block)
      f = Fiber.new(blocking: false){yield}
      unblock :init, f
      f
    end

    def io_wait(...) = @selector.wait(...)

    # cheats
    def t = Thread.new{yield}.value # or we could delegate to a thread-pool
    def address_resolve(h) t{Addrinfo.getaddrinfo(h, nil).map(&:ip_address).uniq} end # rubocop:disable Naming/MethodParameterName
    def process_wait(pid, flags) t{Process::Status.wait(pid, flags)} end

    private

    def run_loop
      safe_run @ready.shift while true # rubocop:disable Style/InfiniteLoop
    ensure
      @fiber = nil
    end

    def safe_run(fiber)
      return unless fiber&.alive?
      fiber.transfer
    rescue StopIteration
      # noop
    rescue Exception => e # rubocop:disable Lint/RescueException
      puts "%p raised [%s] %s" % [fiber, e.class, e]
    end

  end
  scheduler = Scheduler.new
  Fiber.set_scheduler scheduler
  max = 100

benchmark:
  # - name: fiber_queue
  #   script: |
  #     n = 10_000_000
  #     n = 1_000
  #     q = Thread::Queue.new
  #     consumer = Thread::SizedQueue.new 1
  #     Fiber.schedule {
  #       while q.pop
  #         # consuming
  #       end
  #       consumer.close
  #     }

  #     Fiber.schedule {
  #       n.times{
  #         q.push true
  #       }
  #       q.push nil
  #     }

  #     Fiber.sync { consumer.pop }

  - name: fiber_sized_queue
    script: |
      # one producer, one consumer
      n = 1_000_000
      q = Thread::SizedQueue.new(max)
      consumer = Thread::SizedQueue.new 1
      Fiber.schedule {
        while q.pop
          # consuming
        end
        consumer.close
      }

      Fiber.schedule {
        while n > 0
          q.push true
          n -= 1
        end
        q.push nil
      }

      Fiber.sync{consumer.pop}

  - name: fiber_sized_queue2
    script: |
      # one producer, many consumers
      n = 1_000_000
      m = 10
      q = Thread::SizedQueue.new(max)
      consumers = m.times.map do
        consumer = Thread::SizedQueue.new 1
        Fiber.schedule do
          while q.pop
            # consuming
          end
          consumer.close
        end
        consumer
      end

      producer = Thread::SizedQueue.new 1
      Fiber.schedule do
        while n > 0
          q.push true
          n -= 1
        end
        m.times { q.push nil }
        producer.close
      end

      Fiber.sync {
        producer.pop
        consumers.each(&:pop)
      }

  - name: fiber_sized_queue3
    script: |
      # many producers, one consumer
      n = 1_000_000
      m = 10
      q = Thread::SizedQueue.new(max)
      consumer = Thread::SizedQueue.new 1
      Fiber.schedule do
        while q.pop
          # consuming
        end
        consumer.close
      end

      producers = m.times.map do
        producer = Thread::SizedQueue.new 1
        Fiber.schedule do
          while n > 0
            q.push true
            n -= 1
          end
          producer.close
        end
        producer
      end

      Fiber.sync {
        producers.each(&:pop)
        q.push nil
        consumer.pop
      }

  - name: fiber_sized_queue4
    script: |
      # many producers, many consumers
      nr = 1_000_000
      n = 10
      m = 10
      q = Thread::SizedQueue.new(max)
      consumers = n.times.map do
        consumer = Thread::SizedQueue.new 1
        Fiber.schedule do
          while q.pop
            # consuming
          end
          consumer.close
        end
        consumer
      end

      producers = m.times.map do
        producer = Thread::SizedQueue.new 1
        Fiber.schedule do
          while nr > 0
            q.push true
            nr -= 1
          end
          producer.close
        end
        producer
      end

      Fiber.sync {
        producers.each(&:pop)
        n.times { q.push nil }
        consumers.each(&:pop)
      }
